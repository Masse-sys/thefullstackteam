Allowed paths:
- docs/decisions/
- contracts/
- PROJECT_PROFILE.md när teknikprofilen behöver uppdateras

Forbidden:
- ändra produktionsimplementation utan uttryckligt implementeringsuppdrag
- införa en teknik enbart av vana
- dölja osäkerhet eller lämna otestade arkitekturantaganden

En större arkitekturändring kräver mänskligt godkännande innan implementation.
